[project]
name = "deploy-gate-agent"
version = "0.1.0"
description = "A change/deploy-gate agent: a Burr state machine served as an MCP server with Theodosia."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "theodosia>=0.2.0,<0.3",
]

[project.scripts]
deploy-gate-agent = "deploy_gate_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deploy_gate_agent"]
